# ====================================================================
# AI RECRUITMENT INTELLIGENCE HUB - APPLICATION PROPERTIES
# ====================================================================

server.port=8080
spring.application.name=ai-recruitment-intelligence-hub

# --------------------------------------------------------------------
# 1. MYSQL DATABASE CONFIGURATION
# --------------------------------------------------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/recruitment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=root

spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Auto-create & update tables automatically
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false


# --------------------------------------------------------------------
# H2 DATABASE - DISABLED
# --------------------------------------------------------------------

spring.h2.console.enabled=false
# --------------------------------------------------------------------
# 2. APACHE KAFKA CONFIGURATION
# --------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=recruitment-hub-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --------------------------------------------------------------------
# 3. GEMINI API KEY CONFIGURATION (PASTE YOUR GEMINI API KEY HERE!)
# --------------------------------------------------------------------
# Replace YOUR_GEMINI_API_KEY_HERE with your Google Gemini API key (e.g. AIzaSy...)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-1.5-flash

# Logging Level
logging.level.com.recruitment.hub=INFO
logging.level.org.springframework.kafka=WARN
